name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install git-lfs (macOS)
        if: runner.os == 'macOS'
        run: brew install git-lfs
      - run: git lfs install
      - run: pip install -e .[dev]
      - name: Test (Linux, with virtual display for the UI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest -v
      - name: Test
        if: runner.os != 'Linux'
        run: python -m pytest -v
