name: build

# 手動（Actions タブの「Run workflow」）か、v で始まるタグを push したときに、配布用のアプリを作る。
# タグのときは、GitHub の Releases ページにも置く（ログインしなくてもダウンロードできる）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "作るリリースの名前（例：v0.2.0）。空なら Releases には置かない"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: peers-Sync-windows.exe
          - os: macos-latest          # Apple シリコン（M1〜）の Mac
            file: peers-Sync-mac-apple-silicon.zip
          - os: macos-15-intel        # Intel の Mac
            file: peers-Sync-mac-intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller

      # Windows：ダブルクリックだけで開ける、ファイル 1 つの exe
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name peers-Sync --collect-data certifi run_peers_sync.py
          Move-Item dist/peers-Sync.exe "dist/${{ matrix.file }}"

      # Mac：.app を zip にする（Safari は自動で展開してくれる）
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "peers Sync" --collect-data certifi run_peers_sync.py
          ditto -c -k --keepParent "dist/peers Sync.app" "dist/${{ matrix.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # 手動実行のときは、ここでタグも作る（目印を付けるコミットは、実行したコミット）
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: peers Sync ${{ inputs.tag || github.ref_name }}
          body: |
            ## ダウンロード
            | パソコン | ファイル |
            |---|---|
            | Windows | **peers-Sync-windows.exe** |
            | Mac（M1・M2・M3・M4 など） | **peers-Sync-mac-apple-silicon.zip** |
            | Mac（Intel） | **peers-Sync-mac-intel.zip** |

            はじめて開くとき：Windows は「詳細情報」→「実行」、Mac は右クリック →「開く」。
          files: files/*
